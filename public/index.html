<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d17">
<title>AI 狼人杀 · Agent 补位局</title>
<link rel="stylesheet" href="assets/style.css?v=1.2.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐺</text></svg>">
</head>
<body>
<div id="app">

  <!-- ============ 首页 ============ -->
  <section id="screen-home" class="screen active">
    <div class="hero">
      <div class="hero-glow"></div>
      <div class="logo">🐺</div>
      <h1>AI 狼人杀</h1>
      <p class="tagline">Agent 补位局 · 一个人也能开桌</p>
      <p class="sub">5 个 AI 玩家各有性格和记忆，会撒谎、会结盟、会翻车 · 游戏逻辑运行在服务端</p>
    </div>

    <div class="panel">
      <label class="field-label" for="playerName">你的代号</label>
      <div class="row">
        <input id="playerName" class="input" maxlength="8" placeholder="留空则叫「你」">
        <button id="btnStart" class="btn primary">开始一局</button>
      </div>
      <label class="field-label" for="modelSelect" style="margin-top:14px">AI 玩家模型（决定 5 个智能体的言行风格）</label>
      <select id="modelSelect" class="input" style="width:100%;appearance:auto">
        <option value="">加载模型列表…</option>
      </select>
      <div class="ai-status" id="aiStatus">
        <span class="dot"></span><span id="aiStatusText">AI 引擎连接中…</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">全网战绩墙</span>
        <span class="panel-sub" id="matchStats">—</span>
      </div>
      <div id="recentList" class="recent-list"><div class="empty">读取云端对局…</div></div>
    </div>

    <div class="panel rules">
      <div class="panel-title">身份与胜负</div>
      <div class="rule-grid">
        <div class="rule"><span class="re">🐺</span><b>狼人 ×2</b><i>每晚刀一人，白天装好人</i></div>
        <div class="rule"><span class="re">🔮</span><b>预言家 ×1</b><i>每晚验一人，知道好坏</i></div>
        <div class="rule"><span class="re">🧪</span><b>女巫 ×1</b><i>一瓶解药一瓶毒药，各一次</i></div>
        <div class="rule"><span class="re">🧑‍🌾</span><b>平民 ×2</b><i>没有技能，只有嘴和票</i></div>
      </div>
      <p class="hint">狼人全部出局 → 好人胜；狼人数 ≥ 好人数 → 狼人胜。共 6 人，你随机拿一个身份。</p>
    </div>

    <footer class="foot">WorkBuddy 1024 造物挑战 · 云服务驱动<br><span id="ver" style="opacity:.7">v1.2.0</span></footer>
  </section>

  <!-- ============ 对局 ============ -->
  <section id="screen-game" class="screen">
    <div class="topbar">
      <div class="round-badge" id="roundBadge">第 1 夜</div>
      <div class="role-chip" id="myRoleChip">—</div>
      <button class="ghost" id="btnQuit">退出</button>
    </div>

    <div class="seats" id="seats"></div>

    <div class="stage" id="stage">
      <div class="stage-title" id="stageTitle"></div>
      <div class="stage-body" id="stageBody"></div>
      <div class="stage-actions" id="stageActions"></div>
    </div>

    <div class="logbox">
      <div class="tabs" id="recTabs">
        <button class="tab active" data-tab="speech">🗣 发言记录</button>
        <button class="tab" data-tab="events">📋 事件记录</button>
      </div>
      <div class="log-list" id="speechList"></div>
      <div class="log-list" id="logList" style="display:none"></div>
    </div>
  </section>

  <!-- ============ 结算 ============ -->
  <section id="screen-result" class="screen">
    <div class="result-hero" id="resultHero">
      <div class="result-icon" id="resultIcon">🏆</div>
      <h2 id="resultTitle">好人阵营胜利</h2>
      <p id="resultSub"></p>
    </div>
    <div class="panel">
      <div class="panel-title">身份揭晓</div>
      <div id="revealList" class="reveal-list"></div>
    </div>
    <div class="panel">
      <div class="panel-title">AI 内心戏</div>
      <div id="thoughts" class="thoughts"></div>
    </div>
    <div class="panel">
      <div class="panel-title">本局记录</div>
      <div id="resultLog" class="result-log"></div>
    </div>
    <div class="panel">
      <button id="btnAgain" class="btn primary big">再来一局</button>
      <p class="hint" id="saveState"></p>
    </div>
  </section>

</div>

<script src="assets/app.js?v=1.2.0"></script>
</body>
</html>
