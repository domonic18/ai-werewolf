<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><script src="https://cdn.tailwindcss.com"></script></head>
<body style="margin:0;background:#1a1b22;display:flex;justify-content:center">
<main data-name="werewolf-login-v14" class="flex flex-col justify-start items-center w-[390px] min-h-[844px] bg-[#07080F] p-[20px] gap-[16px]" style="font-family:Inter,-apple-system,'PingFang SC',sans-serif">
<div data-name="login-hero" class="flex flex-col justify-start items-center self-stretch pt-[34px] gap-[10px]"><div data-name="login-logo" class="flex flex-row justify-center items-center w-[56px] h-[56px] rounded-[28px] border border-[#F6C76A]/30" style="background:linear-gradient(135deg,rgba(246,199,106,0.24),rgba(255,255,255,0.04))"><span data-name="login-logo-icon" class="text-[26px] text-[#F6C76A]" style="font-style:normal">🐺</span></div><p data-name="login-title" class="self-stretch text-[22px] leading-[30px] font-extrabold text-[#EEF1F8] text-center" style="margin:0">登录后开始</p><p data-name="login-sub" class="self-stretch text-[12px] leading-[18px] text-[#8B93AB] text-center" style="margin:0">保存战绩 · 跨设备续局 · 上榜战绩墙</p></div>
<div data-name="login-card" class="flex flex-col justify-start items-stretch self-stretch rounded-[18px] p-[16px] gap-[14px]" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.09)"><div data-name="login-tabs" class="flex flex-row justify-start items-center self-stretch rounded-[12px] p-[4px] gap-[4px]" style="background:rgba(255,255,255,0.04)"><div data-name="tab-email" class="flex flex-row justify-center items-center flex-1 h-[34px] rounded-[9px]" style="background:#F0B64D"><span data-name="tab-email-text" class="text-[13px] leading-[18px] font-bold text-[#0B0D17] text-center">邮箱</span></div><div data-name="tab-phone" class="flex flex-row justify-center items-center flex-1 h-[34px] rounded-[9px]"><span data-name="tab-phone-text" class="text-[13px] leading-[18px] font-semibold text-[#8B93AB] text-center">手机号</span></div></div>
<div data-name="field-email" class="flex flex-col justify-start items-stretch gap-[6px]"><p data-name="field-email-label" class="self-stretch text-[11px] leading-[16px] text-[#8B93AB] text-left" style="margin:0">邮箱地址</p><div data-name="input-email" class="flex flex-row justify-start items-center self-stretch h-[44px] rounded-[12px]" style="background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.12);padding:0 14px"><p data-name="input-email-text" class="flex-1 text-[14px] leading-[20px] text-[#EEF1F8] text-left" style="margin:0">domonic@17aitech.com</p><span data-name="envelope-icon" class="text-[12px] text-[#5B627A]" style="font-style:normal">✉️</span></div></div>
<div data-name="field-code" class="flex flex-col justify-start items-stretch gap-[6px]"><p data-name="field-code-label" class="self-stretch text-[11px] leading-[16px] text-[#8B93AB] text-left" style="margin:0">验证码</p><div data-name="code-row" class="flex flex-row justify-start items-center self-stretch gap-[8px]"><div data-name="input-code" class="flex flex-row justify-start items-center flex-1 h-[44px] rounded-[12px]" style="background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.12);padding:0 14px"><p data-name="input-code-text" class="flex-1 text-[14px] leading-[20px] text-[#6B7290] text-left" style="margin:0">6 位数字</p></div><div data-name="btn-send-code" class="flex flex-row justify-center items-center h-[44px] rounded-[12px]" style="background:rgba(246,199,106,0.14);border:1px solid rgba(246,199,106,0.4);padding:0 14px"><span data-name="btn-send-code-text" class="text-[12px] leading-[16px] font-bold text-[#F6C76A] text-center">获取验证码</span></div></div></div>
<div data-name="btn-login" class="flex flex-row justify-center items-center self-stretch h-[46px] rounded-[12px]" style="background:linear-gradient(135deg,#F9D68B,#F0B64D)"><span data-name="btn-login-text" class="text-[15px] leading-[20px] font-bold text-[#0B0D17] text-center">登录 / 注册</span></div>
<div data-name="divider" class="flex flex-row justify-center items-center self-stretch gap-[10px]"><div data-name="divider-l" class="flex-1 h-[1px]" style="background:rgba(255,255,255,0.1)"></div><span data-name="divider-text" class="text-[10px] leading-[14px] text-[#5B627A] text-center">或</span><div data-name="divider-r" class="flex-1 h-[1px]" style="background:rgba(255,255,255,0.1)"></div></div>
<div data-name="btn-wb" class="flex flex-row justify-center items-center self-stretch h-[44px] rounded-[12px] gap-[8px]" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1)"><span data-name="wb-icon" class="text-[12px] text-[#C4B5FD]" style="font-style:normal">⚡</span><span data-name="btn-wb-text" class="text-[13px] leading-[18px] font-semibold text-[#EEF1F8] text-center">WorkBuddy 账号一键登录</span></div>
<div data-name="btn-wechat" class="flex flex-row justify-center items-center self-stretch h-[44px] rounded-[12px] gap-[8px]" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1)"><span data-name="wechat-icon" class="text-[14px] text-[#6AD6A8]" style="font-style:normal">💬</span><span data-name="btn-wechat-text" class="text-[13px] leading-[18px] font-semibold text-[#EEF1F8] text-center">微信登录</span></div></div>
<div data-name="guest-entry" class="flex flex-row justify-center items-center self-stretch h-[36px] gap-[6px]"><p data-name="guest-text" class="text-[12px] leading-[18px] font-medium text-[#8B93AB] text-center" style="margin:0">先随便玩玩，不登录也能开一局</p><span data-name="arrow-right-icon" class="text-[10px] text-[#8B93AB]" style="font-style:normal">→</span></div>
<div data-name="agree-row" class="flex flex-row justify-start items-start self-stretch gap-[8px]"><div data-name="checkbox" class="flex flex-row justify-center items-center w-[14px] h-[14px] rounded-[4px]" style="background:rgba(246,199,106,0.9);margin-top:2px"><span data-name="check-icon" class="text-[8px] text-[#0B0D17]" style="font-style:normal">✓</span></div><p data-name="agree-text" class="flex-1 text-[10px] leading-[15px] text-[#6B7290] text-left" style="margin:0">我已阅读并同意 <span data-name="link-terms" class="text-[#8B93AB]">用户协议</span> 与 <span data-name="link-privacy" class="text-[#8B93AB]">隐私政策</span></p></div>
<div data-name="footer" class="flex flex-col justify-start items-center self-stretch pt-[10px] gap-[4px]"><p data-name="footer-author" class="self-stretch text-[11px] leading-[16px] text-[#5B627A] text-center" style="margin:0">by domonic · 17aitech.com</p><p data-name="footer-version" class="self-stretch text-[11px] leading-[16px] text-[#5B627A] text-center" style="margin:0">WorkBuddy 1024 造物挑战 · v1.4</p></div>
</main></body></html>
